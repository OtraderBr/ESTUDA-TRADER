<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Motor Brooks</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            zinc: { 850: '#f4f4f5', 950: '#fafafa' }
          }
        }
      }
    }
  </script>

  <!-- Marked (markdown → HTML no paste) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Estilos globais -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/markdown-styles.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#f8fafc] text-zinc-900 h-screen overflow-hidden">

  <!-- Loading screen -->
  <div id="loading-screen"
    class="min-h-screen flex items-center justify-center text-emerald-500 absolute inset-0 z-50 bg-[#f8fafc]">
    <div class="flex flex-col items-center gap-4">
      <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center">
        <i data-lucide="brain-circuit" class="w-5 h-5 text-white"></i>
      </div>
      <p class="text-zinc-400 font-medium text-sm animate-pulse">Inicializando Motor Brooks…</p>
    </div>
  </div>

  <!-- App container -->
  <div id="app-container" class="flex h-screen w-full" style="display: none;">

    <!-- Sidebar (desktop: static | mobile: drawer) -->
    <div id="sidebar-container"></div>

    <!-- Mobile overlay (sidebar drawer) -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden backdrop-blur-sm"></div>

    <!-- Main area -->
    <main class="flex-1 min-w-0 h-full relative flex flex-col overflow-hidden">

      <!-- Top header (mobile hamburger + back button) -->
      <header id="main-header"
        class="hidden shrink-0 flex items-center gap-3 px-4 py-3
               border-b border-zinc-200/80 bg-white/80 backdrop-blur-sm sticky top-0 z-10">
        <!-- Mobile hamburger (visible only without bottom-nav logic, keep for back-btn use) -->
        <button id="mobile-menu-btn"
          class="p-2 -ml-1 hover:bg-zinc-100 rounded-lg md:hidden text-zinc-500">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <h1 id="header-brand"
          class="font-bold text-zinc-900 text-[15px] leading-tight cursor-pointer hover:text-emerald-600 transition-colors">
          Motor Brooks
        </h1>

        <!-- Topbar Timer Widget (sessão ativa) — alinhado à direita -->
        <div class="ml-auto flex items-center gap-2">
          <div id="topbar-timer" class="flex items-center"></div>
          <button id="header-back-btn"
            class="flex items-center gap-1.5 text-xs font-medium text-zinc-500
                   hover:text-zinc-900 bg-zinc-100 hover:bg-zinc-200 px-3 py-1.5 rounded-full transition-colors"
            style="display: none;">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar
          </button>
        </div>
      </header>

      <!-- View content -->
      <div id="view-container" class="flex-1 overflow-y-auto w-full relative min-h-0"></div>
    </main>

    <!-- ── Painel de conceito (right drawer) ─────────────────────────────── -->
    <div id="concept-panel"
      class="fixed right-0 top-0 h-full w-full md:w-[480px] lg:w-[540px]
             bg-white border-l border-zinc-200 shadow-2xl z-30
             transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">

      <!-- Panel top bar -->
      <div class="flex items-center gap-2 px-4 py-3 border-b border-zinc-200 bg-zinc-50/80 shrink-0">
        <button id="panel-close-btn"
          class="p-1.5 rounded-lg hover:bg-zinc-200 text-zinc-400 hover:text-zinc-700 transition-colors"
          title="Fechar">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <span class="text-[13px] font-semibold text-zinc-700 flex-1 truncate" id="panel-title"></span>
        <button id="panel-fullpage-btn"
          class="flex items-center gap-1.5 px-2.5 py-1.5 text-[11px] font-semibold text-zinc-500
                 hover:text-zinc-900 hover:bg-zinc-200 rounded-lg transition-colors border border-zinc-200"
          title="Tela cheia">
          <i data-lucide="maximize-2" class="w-3 h-3"></i>
          Tela cheia
        </button>
      </div>

      <div id="concept-panel-body" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- Panel overlay (mobile) -->
    <div id="panel-overlay" class="fixed inset-0 bg-black/30 z-20 hidden md:hidden"></div>

    <!-- ── Bottom navigation (mobile only) ───────────────────────────────── -->
    <nav id="mobile-bottom-nav"
      class="md:hidden fixed bottom-0 inset-x-0 z-20
             bg-white/95 backdrop-blur-md border-t border-zinc-200
             grid grid-cols-5 safe-bottom"
      style="height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
    </nav>

  </div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
